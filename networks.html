<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мережі // Таємниці Світу</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #d1d5db;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 700;
            color: #f3f4f6;
            letter-spacing: 1px;
        }
        nav a {
            color: #9ca3af;
            text-decoration: none;
            margin-left: 25px;
            transition: color 0.2s;
            font-size: 0.9rem;
        }
        nav a:hover, nav a.active {
            color: #3b82f6;
        }
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 50px 20px;
        }
        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 10px;
            text-align: center;
        }
        .sub-header {
            text-align: center;
            color: #3b82f6;
            font-size: 0.85rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .section-title {
            font-size: 1rem;
            color: #6b7280;
            margin: 30px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 5px;
        }
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background: #111827;
            color: #e5e7eb;
            border: 1px solid #374151;
            padding: 15px 20px;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: block;
        }
        .btn:hover {
            background: #1f2937;
            border-color: #3b82f6;
            color: #ffffff;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #4b5563;
            border-top: 1px solid #1f2937;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Організація</div>
        <nav>
            <a href="index.html">Головна Сторінка</a>
            <a href="links.html">Посилання</a>
            <a href="clearance.html">Відомості</a>
            <a href="archive.html">Архів</a>
        </nav>
    </header>

    <main>
        <h1>Мережевий Хаб</h1>
        <div class="sub-header">[ КАНАЛИ ЗВ'ЯЗКУ ТА ЗОВНІШНІ ВУЗЛИ ]</div>

        <div class="section-title">Доступні платформи зв'язку</div>
        <div class="grid-buttons">
            <a href="steam.html" class="btn">Канал Steam</a>
            <a href="telegram.html" class="btn">Телеграм-канали</a>
            <a href="viber.html" class="btn">Вайбер-група</a>
        </div>
    </main>

    <footer>
        Мережевий шлюз маршрутизації активний.
    </footer>

</body>
</html>
